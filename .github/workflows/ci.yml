name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── BACKEND TESTS ───
  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        working-directory: ./back
        run: chmod +x mvnw

      - name: Test Backend (with coverage)
        working-directory: ./back
        run: ./mvnw verify -q

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/
          retention-days: 7

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: back/target/surefire-reports/
          retention-days: 7

  # ─── FRONTEND TESTS ───
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./front
        run: npm ci

      - name: Create Frontend Environment File
        working-directory: ./front
        run: |
          mkdir -p src/environments
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: true,
            apiUrl: 'http://localhost:8080'
          };
          EOF

      - name: Test Frontend (with coverage)
        working-directory: ./front
        run: npx ng test --coverage --watch=false

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage-report
          path: front/coverage/
          retention-days: 7

  # ─── NOTIFY ───
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    if: failure()
    steps:
      - name: Send failure notification
        run: echo "Build failed - check GitHub Actions for details"
