name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Backend
        working-directory: ./back
        run: ./mvnw clean verify -q

      - name: Build Frontend
        working-directory: ./front
        run: |
          npm ci
          npm run build

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: back/target/surefire-reports/
          retention-days: 7

  jacoco:
    name: JaCoCo Coverage
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generate Coverage Report
        working-directory: ./back
        run: ./mvnw jacoco:report

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: back/target/site/jacoco/
          retention-days: 7

      - name: Check Coverage Thresholds
        working-directory: ./back
        run: |
          ./mvnw jacoco:check \
            -Djacoco.line.coveredratio=0.65 \
            -Djacoco.branch.coveredratio=0.40

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, jacoco]
    if: failure()
    steps:
      - name: Send failure notification
        run: echo "Build failed - check GitHub Actions for details"